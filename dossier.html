<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Dossier</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e6e6eb;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    h1 {
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #a0a4b8;
      margin-bottom: 3rem;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 1.25rem 0;
      border-bottom: 1px solid #222;
    }

    .date {
      display: block;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 0.25rem;
      letter-spacing: 0.05em;
    }

    a {
      color: #e6e6eb;
      text-decoration: none;
    }

    a:hover {
      color: #b33a3a;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>The Dossier</h1>
    <p class="subtitle">
      A chronological record of political, financial, and moral corruption.
      Categories will be introduced once the historical record is complete.
    </p>

    <ul id="dossier-list"></ul>

    <footer>
      <p><a href="index.html">← Return to Introduction</a></p>
    </footer>
  </div>

  <script>
    fetch('/actions/index.json')
      .then(response => response.json())
      .then(entries => {
        const list = document.getElementById('dossier-list');

        entries.forEach(entry => {
          const li = document.createElement('li');

          li.innerHTML = `
            <span class="date">${entry.date}</span>
            <a href="actions/${entry.slug}">
              ${entry.title}
            </a>
          `;

          list.appendChild(li);
        });
      })
      .catch(err => {
        console.error('Failed to load dossier entries', err);
      });
  </script>
</body>
</html>
